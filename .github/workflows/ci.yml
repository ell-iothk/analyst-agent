name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v5

      - name: Pasang uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Pasang dependensi persis sesuai uv.lock
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Test
        run: make test