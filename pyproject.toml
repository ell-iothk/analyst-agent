description = "Indonesian-language text-to-SQL agent for any SQL database via MCP"
[project]
name = "analyst"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fadelkresna", email = "kresnadfadel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
analyst = "analyst:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
